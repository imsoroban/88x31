<!DOCTYPE html>

    <style>
    @font-face {
      font-family: 'minecraft';
      src: url('font.ttf') format('truetype');
    }

    :root {
      --bg-color: #0d0e12;
      --text-color: #c0c0c0;
      --accent-color: #ff55a3;
      --accent-hover: #ff99c8;
      --card-bg: #050508;
      --card-border: #ff55a3;
      --muted-text: #888888;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'minecraft', monospace;
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }

    #wrap {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }

    .nav {
      display: flex;
      justify-content: flex-end;
      gap: 16px;
      margin-bottom: 30px;
    }

    .nav a, a {
      color: var(--accent-color);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .nav a:hover, a:hover {
      color: var(--accent-hover);
    }

    .main-title {
      font-size: 2.5em;
      color: #ffffff;
      margin-bottom: 20px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 24px;
      border-radius: 4px;
      text-align: left;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      margin-bottom: 20px;
    }

    .card h2 {
      color: var(--accent-color);
      margin-top: 0;
      font-size: 1.4em;
    }

    .outro {
      font-size: 0.9em;
      color: var(--muted-text);
      margin-top: 12px;
      margin-bottom: 0;
    }

    .search-input {
      width: 100%;
      box-sizing: border-box;
      background-color: var(--bg-color);
      border: 1px solid var(--card-border);
      color: #ffffff;
      font-family: 'minecraft', monospace;
      font-size: 0.95em;
      padding: 10px 12px;
      border-radius: 4px;
      margin-top: 12px;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--accent-hover);
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-top: 16px;
    }

    .buttons img {
      width: 88px;
      height: 31px;
      image-rendering: pixelated;
      cursor: pointer;
      border: 1px solid transparent;
      transition: transform 0.1s ease, border-color 0.15s ease;
    }

    .buttons img:hover {
      transform: scale(1.08);
      border-color: var(--accent-color);
    }

    #toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: var(--card-bg);
      border: 1px solid var(--accent-color);
      color: #ffffff;
      padding: 10px 16px;
      border-radius: 4px;
      font-size: 0.9em;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.7);
    }

    #toast.show {
      opacity: 1;
    }
  </style>
  </head>

</html>
